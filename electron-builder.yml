appId: in.kdspathology.labdesk
productName: KDS Lab Desk
copyright: K.D.S. Pathology
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
asarUnpack:
  - node_modules/pdfjs-dist/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  # no code-signing certificate: the installer is unsigned (Windows SmartScreen shows "More info → Run anyway" once)
  signExecutable: false
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: KDS Lab Desk
  # no spaces: GitHub renames spaces in asset names, which would break latest.yml
  artifactName: KDS-Lab-Desk-Setup.exe
  deleteAppDataOnUninstall: false
  runAfterFinish: true
# Updates are published by hand to the public releases repo (see docs/RELEASING.md); this only makes latest.yml.
publish:
  provider: github
  owner: santoshray02
  repo: kds-lab-desk
  releaseType: release
