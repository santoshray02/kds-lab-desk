<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K.D.S. Pathology – Your report</title>
<style>
  :root { --ink:#1c2033; --muted:#5d6378; --line:#dfe2ec; --hema:#3a3a8c; --paper:#f7f8fb; --bad:#c2185b; --ok:#2e7d4f; }
  * { box-sizing: border-box; }
  body { margin:0; font:18px/1.5 system-ui, "Segoe UI", sans-serif; color:var(--ink); background:var(--paper); }
  main { max-width:460px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; color:var(--hema); }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; margin-top:16px; }
  input { width:100%; font-size:28px; letter-spacing:.4em; text-align:center; padding:12px; border:2px solid var(--line); border-radius:10px; }
  button { width:100%; margin-top:14px; padding:14px; font-size:19px; font-weight:700; border:0; border-radius:10px; background:var(--hema); color:#fff; }
  button:disabled { opacity:.5; }
  .muted { color:var(--muted); font-size:15px; }
  .bad { color:var(--bad); font-weight:600; }
  .ok { color:var(--ok); font-weight:600; }
  iframe { width:100%; height:78vh; border:1px solid var(--line); border-radius:10px; margin-top:12px; background:#fff; }
  a.dl { display:block; text-align:center; margin-top:12px; font-weight:700; color:var(--hema); }
</style>
</head>
<body>
<main>
  <h1>K.D.S. Pathology</h1>
  <div class="muted">Computerised Janch Ghar · Dalsingsarai</div>
  <div class="card" id="status">Checking report…</div>
  <div class="card" id="pinbox" hidden>
    <label for="pin"><b>Enter your PIN</b></label>
    <div class="muted" style="margin-bottom:8px">The 4 digits sent with the link (usually the last 4 digits of your phone number).</div>
    <input id="pin" inputmode="numeric" maxlength="4" autocomplete="one-time-code" aria-label="4 digit PIN">
    <button id="go" disabled>Show my report</button>
    <div id="msg" class="muted" style="margin-top:10px"></div>
  </div>
  <div id="viewer" hidden></div>
</main>
<script>
// Set these two values once when the page is published (see docs/CLOUD-SETUP.md).
// The anon key is meant to be public; it can only call the Edge Function.
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-KEY";

const code = (location.pathname.split('/').filter(Boolean).pop() || new URLSearchParams(location.search).get('r') || '').toUpperCase();
const $ = (id) => document.getElementById(id);

async function call(body) {
  const r = await fetch(SUPABASE_URL + '/functions/v1/get-report', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
    body: JSON.stringify(body)
  });
  return { status: r.status, body: await r.json().catch(() => ({})) };
}

(async () => {
  if (!code) { $('status').innerHTML = '<span class="bad">No report code in this link.</span>'; return; }
  try {
    const { body } = await call({ code });
    if (!body.found) { $('status').innerHTML = '<span class="bad">This report was not found. Please check the link.</span>'; return; }
    if (body.state === 'valid') $('status').innerHTML = '<span class="ok">✔ Genuine report</span><div class="muted">Issued ' + body.issuedOn + '</div>';
    else $('status').innerHTML = '<span class="bad">⚠ This report has been ' + body.state + '.</span><div class="muted">Please ask K.D.S. Pathology for the latest copy.</div>';
    if (body.state === 'valid') $('pinbox').hidden = false;
  } catch (e) { $('status').innerHTML = '<span class="bad">Cannot connect. Please try again with internet.</span>'; }
})();

$('pin').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, ''); $('go').disabled = e.target.value.length !== 4; });
$('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !$('go').disabled) $('go').click(); });
$('go').addEventListener('click', async () => {
  $('go').disabled = true; $('msg').textContent = 'Checking…';
  try {
    const { status, body } = await call({ code, pin: $('pin').value });
    if (body.url) {
      $('pinbox').hidden = true;
      $('viewer').hidden = false;
      $('viewer').innerHTML = '<a class="dl" href="' + body.url + '" download>⬇ Download PDF</a><iframe title="Report" src="' + body.url + '"></iframe>';
    } else if (status === 429) { $('msg').innerHTML = '<span class="bad">Too many wrong tries. Please wait 15 minutes.</span>'; }
    else if (status === 401) { $('msg').innerHTML = '<span class="bad">Wrong PIN. Tries left: ' + body.attemptsLeft + '</span>'; $('go').disabled = false; }
    else { $('msg').innerHTML = '<span class="bad">Report not available.</span>'; }
  } catch (e) { $('msg').innerHTML = '<span class="bad">Cannot connect. Please try again.</span>'; $('go').disabled = false; }
});
</script>
</body>
</html>
